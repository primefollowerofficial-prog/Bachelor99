<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — Bachelor 99 Survival Cookbook</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navigation -->
<header class="navbar scrolled" id="navbar">
  <div class="nav-inner">
    <div class="nav-left">
      <a href="index.html" class="nav-link">Home</a>
      <a href="index.html#contact" class="nav-link">Contact</a>
    </div>

    <a href="index.html" class="logo">Bachelor<span class="logo-accent">99</span></a>

    <div class="nav-right">
      <a class="icon-btn cart-icon-btn" href="cart.html" aria-label="Cart" id="cartBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="cart-badge" id="cartBadge" hidden>0</span>
      </a>
      <button class="hamburger" id="hamburger" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html">Home</a>
    <a href="index.html#reviews-full">Reviews</a>
    <a href="index.html#contact">Contact</a>
  </div>
</header>

<main class="cart-page">
  <h1 class="cart-title">Your Cart</h1>

  <!-- Filled state -->
  <div class="cart-wrap" id="cartFilled" hidden>
    <div class="cart-item">
      <img src="images/Ebook1.png" alt="Bachelor 99 Survival Cookbook">
      <div class="cart-item-info">
        <h3>Bachelor 99 Survival Cookbook</h3>
        <p class="muted">Digital PDF · Instant download</p>
        <div class="price-row">
          <span class="price-old">₹199</span>
          <span class="price-new">₹99</span>
        </div>
        <div class="qty-selector" role="group" aria-label="Quantity">
          <button id="cartQtyMinus" aria-label="Decrease quantity">−</button>
          <span id="cartQtyValue">1</span>
          <button id="cartQtyPlus" aria-label="Increase quantity">+</button>
        </div>
      </div>
      <button class="cart-remove" id="cartRemove" aria-label="Remove item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      </button>
    </div>

    <div class="cart-summary">
      <div class="cart-summary-row">
        <span>Subtotal</span>
        <span id="cartSubtotal">₹99</span>
      </div>
      <div class="cart-summary-row cart-summary-total">
        <span>Total</span>
        <span id="cartTotal">₹99</span>
      </div>
      <button class="btn btn-primary btn-shine cart-buy-btn" id="cartBuyNowBtn">Buy Now</button>
      <a href="index.html#product" class="cart-continue">← Continue browsing</a>
    </div>
  </div>

  <!-- Empty state -->
  <div class="cart-empty" id="cartEmpty" hidden>
    <div class="cart-empty-icon">🛍️</div>
    <h2>Your cart is empty</h2>
    <p>Looks like you haven't added the cookbook yet.</p>
    <a href="index.html#product" class="btn btn-primary">Browse Cookbook</a>
  </div>
</main>

<!-- Toast -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="cart-shared.js"></script>
<script src="cart.js"></script>
</body>
</html>
